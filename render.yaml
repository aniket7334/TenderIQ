# Render Blueprint for the TenderIQ API (backend-js).
# Render → New → Blueprint → pick this repository. Values marked `sync: false`
# are asked for during setup (they are secrets and never stored in git).
services:
  - type: web
    name: tenderiq-api
    runtime: node
    plan: free            # sleeps after 15 min without visitors (see DEPLOY.md)
    region: singapore     # closest Render region to India
    rootDir: tenderiq-main/backend-js
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # TiDB Cloud connection string: mysql://USER:PASSWORD@HOST:4000/tenderiq?ssl=true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_CONNECTION_LIMIT
        value: "5"
      # Long random secret for login tokens — generated by Render
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Your Vercel site address(es), comma-separated, e.g. https://tenderiq.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: APP_NAME
        value: TenderIQ
      - key: APP_URL
        sync: false
      - key: DEBUG
        value: "false"
      # Optional: AI tender notes. Leave empty if you don't use them.
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      # GeM refuses Render's servers, so GeM requests go through the relay
      # function on Vercel (Mumbai). Set GEM_PROXY_KEY to the same random value
      # here and in Vercel's environment variables.
      - key: GEM_PROXY_URL
        value: https://tenderiq-theta.vercel.app/api/gem-proxy
      - key: GEM_PROXY_KEY
        sync: false
