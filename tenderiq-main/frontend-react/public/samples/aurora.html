<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TenderIQ · Aurora Glass</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<style>
  body { font-family: Onest, sans-serif; color:#101828; background:#eef1f8; }
  .disp { font-family: 'Bricolage Grotesque', sans-serif; }
  .mesh { position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter: blur(80px); opacity:.75; animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.1); } }
  .glass { background: rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.8); backdrop-filter: blur(22px) saturate(160%);
           box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 20px 50px -24px rgba(30,41,90,.25); }
  [data-lucide] { width:16px; height:16px; stroke-width:2; }
  .pop { animation: pop .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop { from { transform: scale(.97) translateY(10px); } }
  .card:hover { transform: translateY(-4px); box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 30px 60px -24px rgba(30,41,90,.35); }
</style>
</head>
<body class="min-h-screen">
<div class="mesh">
  <div class="blob" style="width:620px;height:620px;left:-120px;top:-160px;background:#ffb169"></div>
  <div class="blob" style="width:560px;height:560px;right:-80px;top:-120px;background:#7c9cff;animation-delay:-6s"></div>
  <div class="blob" style="width:520px;height:520px;left:35%;bottom:-260px;background:#5ee7c4;animation-delay:-12s"></div>
</div>

<div class="mx-auto max-w-[1400px] px-6 py-5">
  <!-- Top bar -->
  <header class="glass pop flex items-center gap-4 rounded-full py-2 pl-3 pr-2">
    <div class="flex items-center gap-2"><div class="flex h-9 w-9 items-center justify-center rounded-full bg-[#101828] text-white disp text-sm font-extrabold">tq</div><span class="disp text-lg font-extrabold tracking-tight">TenderIQ</span></div>
    <nav class="ml-6 flex gap-1 text-[14px] font-medium text-slate-500">
      <a class="rounded-full px-4 py-2">Home</a><a class="rounded-full bg-[#101828] px-4 py-2 text-white">Tenders</a><a class="rounded-full px-4 py-2">Shortlist</a><a class="rounded-full px-4 py-2">Notes</a><a class="rounded-full px-4 py-2">Alerts</a>
    </nav>
    <div class="ml-auto flex w-80 items-center gap-2 rounded-full bg-white/70 px-4 py-2.5 text-sm text-slate-400"><i data-lucide="search"></i>Ask: "solar bids closing this week"</div>
    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-white/80"><i data-lucide="bell"></i></span>
    <img class="h-10 w-10 rounded-full object-cover ring-2 ring-white" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23ffb169'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' font-family='sans-serif' font-size='15' font-weight='700' fill='%23101828'%3EAD%3C/text%3E%3C/svg%3E" />
  </header>

  <!-- Hero bento -->
  <section class="mt-6 grid grid-cols-12 gap-5">
    <div class="glass pop col-span-5 rounded-[28px] p-7" style="animation-delay:.08s">
      <p class="text-sm font-medium text-slate-500">Hello Aarav — here's India today</p>
      <h1 class="disp mt-3 text-[54px] font-extrabold leading-[.95] tracking-[-.03em]">8,412 live<br/>tenders <span class="bg-gradient-to-r from-orange-500 via-pink-500 to-indigo-500 bg-clip-text text-transparent">waiting.</span></h1>
      <div class="mt-6 flex gap-2">
        <button class="flex items-center gap-2 rounded-full bg-[#101828] px-5 py-3 text-sm font-semibold text-white"><i data-lucide="sparkles"></i>Show my matches</button>
        <button class="rounded-full bg-white/80 px-5 py-3 text-sm font-semibold">Scrape now</button>
      </div>
    </div>
    <div class="glass pop col-span-3 rounded-[28px] p-6" style="animation-delay:.16s">
      <p class="text-sm font-medium text-slate-500">Demand by category</p>
      <div class="relative mt-3 flex items-center justify-center">
        <svg viewBox="0 0 120 120" class="h-40 w-40 -rotate-90" id="donut"></svg>
        <div class="absolute text-center"><p class="disp text-3xl font-extrabold">23%</p><p class="text-[11px] text-slate-500">Maintenance</p></div>
      </div>
      <div class="mt-2 grid grid-cols-2 gap-1 text-[12px] text-slate-600" id="dlegend"></div>
    </div>
    <div class="glass pop col-span-4 rounded-[28px] p-6" style="animation-delay:.24s">
      <div class="flex items-center justify-between"><p class="text-sm font-medium text-slate-500">Hot states this week</p><span class="rounded-full bg-orange-100 px-2.5 py-0.5 text-[11px] font-semibold text-orange-700">live</span></div>
      <div class="mt-4 grid grid-cols-6 gap-1.5" id="states"></div>
      <p class="mt-3 text-[12px] text-slate-500">Darker = more new tenders. Maharashtra leads with <b class="text-slate-800">1,204</b>.</p>
    </div>
  </section>

  <!-- Filters -->
  <div class="pop mt-6 flex items-center gap-2" style="animation-delay:.3s">
    <h2 class="disp mr-3 text-2xl font-extrabold tracking-tight">Closing soon</h2>
    <div class="flex gap-2 text-[13px] font-medium" id="pills"></div>
    <span class="ml-auto flex items-center gap-2 rounded-full bg-white/70 px-4 py-2 text-[13px] font-medium"><i data-lucide="sliders-horizontal"></i>Filters</span>
  </div>

  <!-- Cards -->
  <section class="mt-4 grid grid-cols-3 gap-5" id="cards"></section>
</div>

<script>
const T=[
 ['Off-grid solar photovoltaic power plant','Ministry of Defence','Electrical',2,'GeM','from-amber-300 to-orange-500'],
 ['LED luminaire for road & street lighting','Ministry of Power','Road',1,'GeM','from-slate-300 to-slate-500'],
 ['Repair & overhauling — online UPS','Ministry of Steel','Maintenance',5,'GeM','from-emerald-300 to-teal-500'],
 ['Desktop computers with 24" monitor','Ministry of Home Affairs','IT/Software',9,'GeM','from-violet-300 to-indigo-500'],
 ['Maintenance dredging of approach channel','Visakhapatnam Port Trust','Dredging',21,'eTenders','from-cyan-300 to-sky-500'],
 ['Onshore facilities at Akhnoor & Reasi','Indian Port Rail Corp.','Port',22,'eTenders','from-blue-300 to-indigo-500'],
];
const seg=[[23,'#10b981'],[17,'#f59e0b'],[13,'#6366f1'],[10,'#64748b'],[4,'#0ea5e9'],[33,'#e2e8f0']];
let off=0;document.getElementById('donut').innerHTML=seg.map(([p,c])=>{const s=`<circle cx="60" cy="60" r="46" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${p*2.89} 289" stroke-dashoffset="${-off*2.89}" stroke-linecap="butt"/>`;off+=p;return s}).join('');
document.getElementById('dlegend').innerHTML=[['Maintenance','#10b981'],['Electrical','#f59e0b'],['IT/Software','#6366f1'],['Road','#64748b']].map(([n,c])=>`<span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full" style="background:${c}"></span>${n}</span>`).join('');
const S=['MH','UP','TN','KA','GJ','DL','RJ','WB','AP','TS','MP','KL','OR','BR','PB','HR','AS','JH'];
const v=[95,82,74,70,66,62,48,46,58,54,40,36,32,28,26,30,22,18];
document.getElementById('states').innerHTML=S.map((s,i)=>`<div class="flex aspect-square items-center justify-center rounded-lg text-[11px] font-semibold ${v[i]>60?'text-white':'text-slate-700'}" style="background:rgba(234,88,12,${v[i]/100})">${s}</div>`).join('');
document.getElementById('pills').innerHTML=['All','Electrical','Maintenance','IT/Software','Port'].map((p,i)=>`<span class="rounded-full px-4 py-2 ${i?'bg-white/60 text-slate-600':'bg-[#101828] text-white'}">${p}</span>`).join('');
document.getElementById('cards').innerHTML=T.map(([t,b,c,d,src,g],i)=>{const pct=Math.max(6,100-d*4.2),r=22,circ=2*Math.PI*r;return `
 <article class="card glass pop cursor-pointer rounded-[26px] p-5 transition duration-300" style="animation-delay:${.36+i*.06}s">
  <div class="flex items-start justify-between">
   <span class="rounded-full bg-gradient-to-r ${g} px-3 py-1 text-[11px] font-semibold text-white">${c}</span>
   <div class="relative h-14 w-14"><svg viewBox="0 0 56 56" class="h-14 w-14 -rotate-90"><circle cx="28" cy="28" r="${r}" fill="none" stroke="rgba(16,24,40,.08)" stroke-width="5"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${d<=2?'#ef4444':d<=7?'#f59e0b':'#10b981'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${circ*pct/100} ${circ}"/></svg>
   <div class="absolute inset-0 flex flex-col items-center justify-center leading-none"><span class="disp text-[15px] font-extrabold">${d}</span><span class="text-[9px] text-slate-500">days</span></div></div>
  </div>
  <h3 class="disp mt-3 text-[20px] font-semibold leading-tight tracking-tight">${t}</h3>
  <p class="mt-1.5 text-[13px] text-slate-500">${b}</p>
  <div class="mt-5 flex items-center justify-between"><span class="flex items-center gap-1.5 text-[12px] font-medium text-slate-500"><i data-lucide="landmark"></i>${src}</span>
   <span class="flex items-center gap-1 rounded-full bg-[#101828] px-3.5 py-1.5 text-[12px] font-semibold text-white">Open <i data-lucide="arrow-up-right"></i></span></div>
 </article>`}).join('');
lucide.createIcons();
</script>
</body>
</html>
